name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: |
          docker build -t dashboard-api:${{ github.sha }} \
            -f apps/api/Dockerfile .

      # TODO: substituir pelo seu registry e plataforma (Railway, Render, Fly.io, AWS ECS, etc.)
      # Exemplo para Railway:
      # - name: Deploy to Railway
      #   uses: bervProject/railway-deploy@v1
      #   with:
      #     railway_token: ${{ secrets.RAILWAY_TOKEN }}
      #     service: api

      - name: Run migrations
        env:
          DATABASE_SYNC_URL: ${{ secrets.DATABASE_SYNC_URL }}
        run: |
          docker run --rm \
            -e DATABASE_SYNC_URL="$DATABASE_SYNC_URL" \
            dashboard-api:${{ github.sha }} \
            alembic -c db/migrations/alembic.ini upgrade head

  deploy-dashboard:
    name: Deploy Dashboard
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install and build
        working-directory: apps/dashboard
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          npm ci
          npm run build

      # TODO: substituir pelo seu provider de frontend (Vercel, Netlify, etc.)
      # Exemplo para Vercel:
      # - name: Deploy to Vercel
      #   uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #     vercel-args: --prod
