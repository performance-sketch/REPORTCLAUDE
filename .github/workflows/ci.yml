name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test-api:
    name: API — lint, typecheck, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Ruff lint
        run: ruff check apps/api connectors workers

      - name: Mypy typecheck
        run: mypy apps/api/app connectors --ignore-missing-imports

      - name: Run tests
        env:
          DATABASE_SYNC_URL: postgresql://dashboard:password@localhost:5432/dashboard_test
          DATABASE_URL: postgresql+asyncpg://dashboard:password@localhost:5432/dashboard_test
          REDIS_URL: redis://localhost:6379/0
          META_ACCESS_TOKEN: test_token
          META_AD_ACCOUNT_IDS: act_test
          META_APP_ID: test_app_id
          META_APP_SECRET: test_app_secret
          META_API_VERSION: v19.0
          REZDY_API_KEY: test_key
          REZDY_BASE_URL: https://api.rezdy.com/v1
          REZDY_WEBHOOK_SECRET: test_secret
          APP_SECRET_KEY: test_secret_key_32_chars_minimum__
          SYNC_TRIGGER_SECRET: test_sync_secret
        run: pytest apps/api/tests -v --tb=short

  lint-and-build-dashboard:
    name: Dashboard — lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: ESLint
        working-directory: apps/dashboard
        run: npm run lint

      - name: TypeScript check
        working-directory: apps/dashboard
        run: npm run typecheck

      - name: Build
        working-directory: apps/dashboard
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
